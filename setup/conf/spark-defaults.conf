# Baseline config for every lab. Record any override in the config experiment record (plan §1.6).

# --- Iceberg REST catalog "lab" on MinIO
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lab                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lab.type                   rest
spark.sql.catalog.lab.uri                    http://iceberg-rest:8181
spark.sql.catalog.lab.warehouse              s3://warehouse/
spark.sql.catalog.lab.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lab.s3.endpoint            http://s3:8333
spark.sql.catalog.lab.s3.path-style-access   true

# --- s3a:// for plain Parquet / file-source labs
spark.hadoop.fs.s3a.endpoint                 http://s3:8333
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.access.key               admin
spark.hadoop.fs.s3a.secret.key               password
spark.hadoop.fs.s3a.connection.maximum       200

# --- Observability (plan M04): event logs for History Server post-mortems
spark.eventLog.enabled                       true
spark.eventLog.dir                           s3a://spark-events/
spark.history.fs.logDirectory                s3a://spark-events/
spark.ui.prometheus.enabled                  true

# --- Local-mode sizing (driver = executor in local mode)
spark.master                                 local[8]
spark.driver.memory                          8g
spark.sql.shuffle.partitions                 200
# AQE stays at its default (ON). Labs toggle it explicitly (plan M29).
